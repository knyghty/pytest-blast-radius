[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
authors = [
    { "name" = "Tom Carrick", "email" = "tom@carrick.eu" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["pytest>=8"]
description = "Run only the tests affected by your changes"
license = "MIT"
license-files = ["LICENSE"]
name = "pytest-blast-radius"
readme = "README.rst"
requires-python = ">=3.12"
version = "0.1.0"

[project.entry-points.pytest11]
blast_radius = "pytest_blast_radius.plugin"

[project.urls]
Homepage = "https://github.com/knyghty/pytest-blast-radius"
Repository = "https://github.com/knyghty/pytest-blast-radius"

[dependency-groups]
dev = [
  "coverage[toml]",
  "django",
  "factory-boy>=3.3.3",
  "prek",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ty",
]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["pytest_blast_radius"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.hatch.build.targets.wheel]
packages = ["pytest_blast_radius"]

[tool.pytest.ini_options]
addopts = ["-p", "pytester", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "F",
    "FLY",
    "FURB",
    "G",
    "I",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TC",
    "TRY",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
